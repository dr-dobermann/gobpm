version: "2"
run:
  concurrency: 4
  go: "1.25"
  tests: true
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - asciicheck
    - depguard
    - dupl
    - errcheck
    # ADR-034 v.1 §5: an unchecked assertion panics where data.As[T] returns a
    # classified error naming both the held and the wanted type (FIX-034 §1.2).
    - forcetypeassert
    - funlen
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    errcheck:
      # ADR-022: `_ = f()` is a discard, not handling. The one deliberate
      # discard left in the library carries a //nolint with its reason.
      check-blank: true
    depguard:
      rules:
        deny_deprecated:
          deny:
            - pkg: io/ioutil
              desc: io/ioutil is deprecated, use io and os packages instead
        core-no-runtime-no-adapters:
          list-mode: lax
          files:
            - "**/pkg/**/*.go"
            - "**/internal/**/*.go"
            - "**/cmd/**/*.go"
          deny:
            - pkg: "github.com/dr-dobermann/gobpm/runtime"
              desc: "core MUST NOT import runtime (ADR-003 §4.4)"
            - pkg: "github.com/dr-dobermann/gobpm/adapters"
              desc: "core MUST NOT import adapters (ADR-003 §4.4)"
        examples-no-internal:
          files:
            - "**/examples/**/*.go"
          deny:
            - pkg: "github.com/dr-dobermann/gobpm/internal"
              desc: "examples demonstrate public API only (ADR-003 §4.4)"
        # Everything under pkg/ is a public contract an outside author must be
        # able to implement — a port, its bundled battery, or a model type — so
        # none of it may reach into internal/. That is what lets a battery serve
        # as the reference implementation someone copies (SRD-088 FR-9).
        #
        # pkg/thresher is the sole exception: it is the engine facade, wiring
        # internals rather than implementing a port (49 such imports; every
        # other package under pkg/ has none). It has no subpackages, so a single
        # negation covers it — and note the pattern is `.../thresher/*.go`, not
        # `.../thresher/**/*.go`: the latter requires an intervening directory
        # and silently matches nothing.
        #
        # Supersedes model-no-internal, which this strictly contains.
        public-api-no-internal:
          files:
            - "**/pkg/**/*.go"
            - "!**/pkg/thresher/*.go"
          deny:
            - pkg: "github.com/dr-dobermann/gobpm/internal"
              desc: "pkg/ is the public contract surface; it MUST NOT import internal (ADR-003 §4.4). If this is engine wiring rather than a public contract, it belongs in internal/ or in the pkg/thresher facade."
        adapters-no-cross-adapter:
          files:
            - "**/adapters/**/*.go"
          deny:
            - pkg: "github.com/dr-dobermann/gobpm/adapters"
              desc: "adapters MUST NOT import other adapters (ADR-003 §4.4); user composes shared resources at construction time"
        # pkg/convert contains only format-neutral interfaces and the registry.
        # Match direct files only: subpackages such as pkg/convert/bpmn own
        # their serialization implementation.
        convert-seam-format-agnostic:
          files:
            - "**/pkg/convert/*.go"
          deny:
            - pkg: "encoding/xml"
              desc: "XML serialization belongs in a format-specific converter package (SRD-051 §NFR-1)"
            - pkg: "encoding/json"
              desc: "JSON serialization belongs in a format-specific converter package"
    goconst:
      ignore-tests: true
    funlen:
      lines: 100
      statements: 50
    gocritic:
      disabled-checks:
        - ruleguard
        - unnamedResult
        - whyNoLint
        - commentedOutCode
        - hugeParam
      enabled-tags:
        - diagnostic
        - performance
        - experimental
        - opinionated
    gocyclo:
      min-complexity: 15
    govet:
      enable:
        - shadow
        - atomic
        - bools
        - buildtag
        - cgocall
        - composites
        - copylocks
        - deepequalerrors
        - errorsas
        - fieldalignment
        - findcall
        - framepointer
        - httpresponse
        - ifaceassert
        - loopclosure
        - lostcancel
        - nilfunc
        - nilness
        - printf
        - reflectvaluecompare
        - shift
        - sigchanyzer
        - sortslice
        - stdmethods
        - stringintconv
        - structtag
        - testinggoroutine
        - tests
        - unmarshal
        - unreachable
        - unsafeptr
        - unusedresult
    lll:
      line-length: 120
    misspell:
      locale: US
    nestif:
      min-complexity: 4
    staticcheck:
      checks:
        - all
  exclusions:
    presets: []
    rules:
      - linters:
          - lll
        source: '^//go:generate '
    paths:
      - generated
      - .generated
      - examples
      - third_party
      - builtin
      - mock_.*\.go$
      - .*\.pb\.go$
      - .*_mock\.go$
      - _test\.go
# Formatting is a decided rule that nothing enforced: gofmt was configured in
# neither the linter nor CI, so 16 files had drifted unnoticed — the gofmt-lint
# follow-up FIX-022 §8.3 spun off. It runs as a formatter (not a linter) because
# golangci-lint v2 separates the two; `golangci-lint fmt` rewrites, `run` reports.
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - generated/

output:
  formats:
    text:
      path: stdout
