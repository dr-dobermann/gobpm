name: check
on:
  push:
    branches:
      - master
  pull_request:
  # Started by tool-pins.yml on its bump branch: a PR opened with GITHUB_TOKEN
  # triggers no pull_request run (FIX-042).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The postgres-backed tests (adapters/postgres, SRD-078 FR-10) read
    # GOBPM_PG_TEST_DSN and skip when it is unset; the service below
    # provides the database on every PR so the conformance/fencing/e2e
    # paths run — and the diff-coverage gate measures them. Locally the
    # same database comes from `make pg-up` (same DSN shape).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: gobpm-test
        ports:
          - 5499:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      GOBPM_PG_TEST_DSN: postgres://postgres:gobpm-test@localhost:5499/postgres?sslmode=disable
    steps:
      # Actions pinned to a commit SHA (not a moving major tag) for a
      # reproducible supply-chain; the trailing comment names the release so
      # dependabot (github-actions ecosystem) can bump SHA + comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the diff-coverage gate can resolve the merge-base
          # with the base branch (base...HEAD).
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned to the exact patch the go.mod `toolchain` directive
          # requires, so CI and local runs scan the identical stdlib. A
          # bare '1.26' resolved to whatever patch the runner happened to
          # cache, drifting from local results (govulncheck reports stdlib
          # vulns per toolchain patch).
          go-version: '1.26.10'
          cache: true

      - name: Install tools
        run: make tools

      - name: Verify check.yml runs the core gate's steps
        run: make workflow-check

      # All subsequent checks call into Makefile targets so that running
      # `make ci` locally matches what CI runs (this REQUIRED job = the
      # `ci-core` half; the parallel `examples` job below = the `ci-examples`
      # half; local `make ci` runs both). This is the project's
      # "no local/CI drift" rule (see Makefile ci umbrella target).

      # The mocks are committed (FIX-023); this fails if they drift from the
      # interfaces (a changed interface not regenerated + committed).
      - name: Verify committed mocks are current
        run: make mock-check

      - name: Verify core modules tidy
        run: make tidy-check-core

      - name: Lint core modules (ADR-003 import-direction rules enforced)
        run: make lint-core

      - name: Build core modules
        run: make build-core

      # Documentation link gate (FIX-034): relative Markdown links must
      # resolve. Offline and repo-local — no toolchain, no network.
      - name: Documentation link check
        run: make link-check

      # Example-module gate: every examples/* directory must be its own module,
      # or it is invisible to EXAMPLE_MODULES and the parallel examples job
      # never RUNS it (it is only compiled here). Guards that job's coverage
      # from this REQUIRED one, so a hole cannot land unnoticed.
      - name: Example-module check
        run: make examples-module-check

      # Library-consumption guard (FIX-024): an external module must build
      # against gobpm with no test-only (testify) / mock dep leak.
      - name: Consumer-consumption smoke
        run: make consumer-smoke

      - name: Test core modules with race detector
        run: make test-core

      # Diff-coverage gate (SRD-002): reuses the per-module coverage.txt files
      # test-all just wrote (no second test run) — every core module, not only
      # the root, since FIX-034; same `make cover-check` / COVER_MIN the local
      # `make ci` uses, so the verdict is identical local and on CI.
      - name: Diff-coverage gate (changed lines >= COVER_MIN)
        run: |
          git fetch --no-tags origin master
          make cover-check COVER_BASE=origin/master

      # Core modules only: every example consumes the library through
      # `replace ../..`, so this scan already covers their shared graph —
      # the per-example rescan added minutes for no new signal.
      - name: Vulnerability scan
        run: make vuln-core

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # The examples sweep (tidy + lint + build over the ~35 examples/* modules) —
  # split out of the required job because it dominated PR wall time while the
  # examples carry no tests and share the library's dependency graph. Runs in
  # PARALLEL on every PR and on master pushes (the post-merge safety net). It
  # fails honestly (no continue-on-error) so breakage is visible, but it is
  # NOT in the branch-protection required checks — a red here never blocks a
  # merge. Locally, `make ci` still runs this via its `ci-examples` half.
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true

      - name: Install tools
        run: make tools

      - name: Examples sweep (tidy + lint + build + run)
        run: make ci-examples
