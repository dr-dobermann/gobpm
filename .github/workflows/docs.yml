name: docs

# Builds the documentation site (SRD-080) and, on master, deploys it to
# GitHub Pages via the deployment API — no gh-pages branch, no built HTML in
# git history. On pull requests the build job alone runs as a validation
# check: `mkdocs build --strict` fails on any unresolved link or anchor, the
# site-level complement of the repo's relative-link `linkcheck` gate.
#
# One-time repository setting this workflow relies on:
# Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches:
      - master
    # GitHub Actions YAML does not expand anchors — keep this list and the
    # pull_request copy below identical.
    paths:
      - "docs/**"
      - mkdocs.yml
      - scripts/mkdocs_hooks.py
      - Makefile
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - "docs/**"
      - mkdocs.yml
      - scripts/mkdocs_hooks.py
      - Makefile
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to a commit SHA (not a moving major tag) for a
      # reproducible supply-chain; the trailing comment names the release so
      # dependabot (github-actions ecosystem) can bump SHA + comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the site toolchain
        run: make docs-tools

      - name: Build the site (strict)
        run: make docs-build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
